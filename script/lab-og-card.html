<!doctype html>
<!--
  Source for public/lab/og-card.png, the social sharing card for lab.kleer.la.

  The card carries the page's promise as baked-in text, so it goes stale every
  time the copy changes. Keeping the source here means it can be regenerated
  instead of guessed at:

    docker exec eventer_devcontainer-app-1 google-chrome --headless \
      --disable-gpu --no-sandbox --disable-dev-shm-usage \
      --force-device-scale-factor=2 --window-size=1200,678 \
      --virtual-time-budget=5000 --screenshot=/tmp/og.png <this file over http>
    magick /tmp/og.png -resize 1200x678 -colors 255 public/lab/og-card.png

  The logo is the lockup lifted from the original card, embedded so this file
  stands alone. Colours are sampled from that card; the type is Space Grotesk,
  the site's own headline face.
-->

  .grid {

  .logo { position: absolute; top: 46px; left: 54px; height: 76px; }

    position: absolute; inset: 0; display: flex; flex-direction: column;

  h1 {
    font-size: 116px; font-weight: 700; letter-spacing: -0.035em; line-height: 1;

  p {
    font-family: Manrope, system-ui, sans-serif;
    font-size: 35px; font-weight: 400; line-height: 1.34; color: #dbe6ef; max-width: 930px;
  }
  .domain {
    position: absolute; right: 54px; bottom: 42px;
    font-size: 21px; font-weight: 500; letter-spacing: 0.01em; color: #7fa6c4;
  }

proxy:
  hosts:
    - qa.kleer.la
    - qa.latelier.kleer.la
    - qa.lab.kleer.la
  ssl: true
  app_port: 4567
  healthcheck:
    path: /robots.txt
    interval: 3

env:
  clear:
    RACK_ENV: production
    PORT: 4567
    WEB_CONCURRENCY: 1
    CACHE_TTL: 1
    LAB_WHATSAPP_NUMBER: "17868400847"
    # Restyled area and service pages; production keeps the current ones.
    FEATURE_SERVICES_REDESIGN: "true"
  secret:
    - KEVENTER_URL
    - RECAPTCHA_SITE_KEY
    - RECAPTCHA_SECRET_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - CONTACT_US_SECRET
    - CACHE_RESET_TOKEN
    - FEATURE_BOOKING
